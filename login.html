<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Sathvik Supermart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ================= LOGIN SECTION END ================= -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: {
                        brand: {
                            orange: '#ff6b00',
                            yellow: '#ffc107',
                            dark: '#0f0f13',
                            glass: 'rgba(255, 255, 255, 0.05)',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="antialiased min-h-screen flex items-center justify-center relative overflow-hidden">
    <!-- Decorative background elements -->
    <div class="absolute top-0 left-0 w-96 h-96 bg-brand-orange/10 rounded-full blur-[100px] -z-10 pointer-events-none"></div>
    <div class="absolute bottom-0 right-0 w-[500px] h-[500px] bg-blue-500/10 rounded-full blur-[120px] -z-10 pointer-events-none"></div>

    <!-- ================= LOGIN SECTION START ================= -->
    <div class="w-full max-w-md px-4 relative z-10">
        <!-- Logo -->
        <div class="flex justify-center mb-8">
            <a href="index.html" class="flex items-center gap-3 group">
                <div class="relative w-12 h-12 flex items-center justify-center rounded-xl bg-white/5 backdrop-blur-md border border-white/10 shadow-[0_0_15px_rgba(255,107,0,0.3)] overflow-hidden transition-all duration-300 group-hover:shadow-[0_0_20px_rgba(255,107,0,0.6)] group-hover:border-brand-orange/50">
                    <img src="./images/logo.png" alt="Logo" class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-500">
                </div>
                <span class="text-2xl font-bold tracking-wider text-white">SATHVIK<span class="text-brand-orange">MART</span></span>
            </a>
        </div>

        <div class="glass-card p-8 sm:p-10 rounded-3xl relative overflow-hidden">
            <h2 class="text-3xl font-bold text-white mb-2 text-center uppercase tracking-wide">Welcome Back</h2>
            <p class="text-gray-400 text-sm mb-8 text-center">Login to access your account</p>
            
            <form action="#" method="POST" class="space-y-5">
                <div class="relative group">
                    <span class="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 group-focus-within:text-brand-orange transition-colors"><i class="fas fa-envelope"></i></span>
                    <input type="email" id="email" name="email" placeholder="Email Address" required
                        class="w-full bg-white/5 border border-white/10 rounded-xl py-4 pl-12 pr-4 text-white focus:outline-none focus:border-brand-orange focus:bg-white/[0.08] transition-all duration-300">
                </div>
                <div class="relative group">
                    <span class="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 group-focus-within:text-brand-orange transition-colors"><i class="fas fa-lock"></i></span>
                    <input type="password" id="password" name="password" placeholder="Password" required
                        class="w-full bg-white/5 border border-white/10 rounded-xl py-4 pl-12 pr-12 text-white focus:outline-none focus:border-brand-orange focus:bg-white/[0.08] transition-all duration-300">
                    <button type="button" class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-white transition-colors focus:outline-none" onclick="togglePassword('password')"><i class="fas fa-eye"></i></button>
                </div>

                <div class="flex items-center justify-between mt-4">
                    <label class="flex items-center text-sm text-gray-400 cursor-pointer hover:text-white transition-colors">
                        <input type="checkbox" class="mr-2 accent-brand-orange rounded bg-white/10 border-white/20"> Remember me
                    </label>
                    <a href="#" class="text-sm text-brand-orange hover:text-white transition-colors">Forgot password?</a>
                </div>

                <button type="submit" class="w-full btn-glow py-4 rounded-xl text-white font-bold uppercase tracking-widest mt-6 transition-all duration-300">
                    Login Now
                </button>
            </form>

            <p class="text-center text-gray-400 text-sm mt-8">
                Don't have an account? <a href="register.html" class="text-brand-orange font-semibold hover:text-white transition-colors">Register here</a>
            </p>
        </div>
        <div class="text-center mt-8">
            <a href="index.html" class="text-gray-500 hover:text-white text-sm transition-colors"><i class="fas fa-arrow-left mr-2"></i> Back to Home</a>
        </div>
    </div>

    <!-- ================= LOGIN SECTION END ================= -->
    <script>
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.nextElementSibling.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
